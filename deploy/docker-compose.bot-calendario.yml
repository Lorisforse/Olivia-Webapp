# Bot Telegram Olivia con i promemoria appuntamenti, buildato dai sorgenti della
# cartella olivia-chatbot-calendario (copia del bot con le modifiche per l'agenda).
# Sostituisce docker-compose.bot.yml quando si vuole usare questa versione:
# stesso container_name, stessa rete, stesso Mongo.
#
#   BOT_SRC_DIR=/opt/olivia-bot-calendario \
#   docker compose --env-file deploy/.env.bot -f deploy/docker-compose.bot-calendario.yml up -d --build
#
# Per tornare al bot originale: down di questo file e up di docker-compose.bot.yml.

services:
  olivia-bot:
    build:
      context: ${BOT_SRC_DIR:-/opt/olivia-bot-calendario}
      dockerfile: infra/Dockerfile
    image: olivia-chatbot-calendario:latest
    container_name: olivia-bot
    restart: unless-stopped
    networks:
      - olivia-network
    environment:
      - OLIVIA_TELEGRAM_TOKEN=${OLIVIA_TELEGRAM_TOKEN}
      - OLIVIA_LLM_API_KEY=${OLIVIA_LLM_API_KEY}
      - OLIVIA_LLM_BASE_URL=${OLIVIA_LLM_BASE_URL}
      - OLIVIA_LLM_DEFAULT_MODEL=${OLIVIA_LLM_DEFAULT_MODEL}
      - OLIVIA_MONGO_DB_HOST=olivia-mongo-db
      - OLIVIA_MONGO_DB_PORT=27017
      - OLIVIA_MONGO_DB_USERNAME=olivia
      - OLIVIA_MONGO_DB_PASSWORD=olivia
      - OLIVIA_MONGO_DB_DATABASE=olivia
    volumes:
      - olivia-bot-logs:/app/logs

volumes:
  olivia-bot-logs:

networks:
  olivia-network:
    external: true
