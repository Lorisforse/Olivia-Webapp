# Esempio di config per l'nginx già presente sul VPS (host-level, non dockerizzato
# in questo esempio). Sostituire lorisamato.it con il dominio reale e adattare i
# path ai certificati/percorsi già in uso per gli altri servizi (es. nefta.it).
#
# Dopo aver piazzato i due server block e ricaricato nginx, generare i certificati con:
#   certbot --nginx -d api.olivia.lorisamato.it -d app.olivia.lorisamato.it

# --- Backend API ---
server {
    listen 80;
    server_name api.olivia.lorisamato.it;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Frontend (dashboard reale, connessa al backend sopra — distinta dalla demo su GitHub Pages) ---
server {
    listen 80;
    server_name app.olivia.lorisamato.it;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
