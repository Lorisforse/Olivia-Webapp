# Config nginx reale per Olivia, deployata su /opt/nginx/conf.d/olivia.conf sul VPS.
# nginx gira containerizzato (container "nginx", condiviso con nefta.it/SAM/csv-analyzer/...),
# non nativo sull'host — per questo:
#   - niente "resolver 127.0.0.11 valid=30s;" qui: è già dichiarato in default.conf
#     (stesso http{} condiviso tra tutti i file in conf.d, dichiararlo due volte
#     fa fallire "nginx -t" con "resolver directive is duplicate")
#   - i backend si raggiungono per NOME container su una rete Docker condivisa
#     (olivia-network, agganciata al container nginx con
#     `docker network connect olivia-network nginx`), non su 127.0.0.1:porta
#   - il proxy_pass usa la variabile ($backend/$frontend) invece di un valore
#     statico: forza nginx a ri-risolvere il nome ad ogni richiesta invece di
#     cachare l'IP del container per tutta la vita del processo. Necessario
#     perché Jenkins ricrea backend/frontend ad ogni deploy con un IP nuovo.
#
# Certificati: stesso meccanismo già in uso per nefta.it — webroot su
# /opt/nefta/certbot/www, salvati in /opt/nefta/letsencrypt, rinnovo automatico
# già coperto dal cron esistente (/usr/local/bin/nefta_cert_renew.sh usa
# "certbot renew" generico, scansiona tutta la cartella).

server {
    listen 80;
    listen [::]:80;
    server_name api.olivia.lorisamato.it;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.olivia.lorisamato.it;

    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.olivia.lorisamato.it;

    ssl_certificate     /etc/letsencrypt/live/api.olivia.lorisamato.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.olivia.lorisamato.it/privkey.pem;

    location / {
        set $backend http://olivia-backend:8000;
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.olivia.lorisamato.it;

    ssl_certificate     /etc/letsencrypt/live/app.olivia.lorisamato.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.olivia.lorisamato.it/privkey.pem;

    location / {
        set $frontend http://olivia-frontend:80;
        proxy_pass         $frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
