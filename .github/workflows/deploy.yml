name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: olivia-frontend/package-lock.json

      - name: Install dependencies
        working-directory: olivia-frontend
        run: npm install

      - name: Build
        working-directory: olivia-frontend
        run: npm run build

      # GitHub Pages serve file statici: senza questa copia un ricaricamento su
      # una rotta del router (es. /login) risponderebbe 404.
      - name: SPA fallback
        working-directory: olivia-frontend
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: olivia-frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
